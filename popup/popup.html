<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clippy</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="settings-menu">
        <div class="setting">
            <input type="checkbox" id="show-hints" />
            <label for="show-hints">Show Hints</label>
        </div>
        <div class="setting">
            <span id="hint-chance-value" style="width: 20px; text-align: center;">50%</span>
            <input type="range" id="hint-chance" min="0" max="100" value="50" steps/>
            <label for="hint-chance">Chance that a hint appears</label>
        </div>
        <div class="setting">
            <input type="checkbox" id="remove-ai-overview" />
            <label for="remove-ai-overview">Remove Google AI Overview</label>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
